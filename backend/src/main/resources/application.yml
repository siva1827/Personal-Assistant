spring:
  application:
    name: assistant
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/assistant}
    username: ${DB_USER:assistant}
    password: ${DB_PASSWORD:assistant}
  jpa:
    open-in-view: false
    properties:
      # Timestamps are stored in UTC whatever the server timezone is
      hibernate.jdbc.time_zone: UTC
    hibernate:
      # Flyway owns the schema
      ddl-auto: none
  flyway:
    enabled: true

app:
  jwt:
    # Required, at least 32 characters. Never commit a real value.
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
  notifications:
    # How often reminders are generated for every user (ISO-8601 duration)
    interval: ${NOTIFICATION_INTERVAL:PT30M}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost,https://localhost,capacitor://localhost}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
