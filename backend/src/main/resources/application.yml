spring:
  application:
    name: assistant
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/assistant}
    username: ${DB_USER:assistant}
    password: ${DB_PASSWORD:assistant}
  jpa:
    open-in-view: false
    properties:
      # Timestamps are stored in UTC whatever the server timezone is
      hibernate.jdbc.time_zone: UTC
    hibernate:
      # Flyway owns the schema
      ddl-auto: none
  flyway:
    enabled: true

app:
  jwt:
    # Required, at least 32 characters. Never commit a real value.
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
  notifications:
    # How often reminders are generated for every user (ISO-8601 duration)
    interval: ${NOTIFICATION_INTERVAL:PT30M}
  ai:
    # auto = Gemini when GEMINI_API_KEY is set; demo = made-up recipes for trying the flow; none = off
    provider: ${AI_PROVIDER:auto}
    daily-limit: ${AI_DAILY_LIMIT:20}
    cache-minutes: ${AI_CACHE_MINUTES:30}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: https://generativelanguage.googleapis.com
      timeout-seconds: 60
  firebase:
    # Push messages are off unless one of these is set (see docs/FIREBASE_SETUP.md).
    # A service-account key file path, or the JSON itself for hosts where files are awkward.
    credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost,https://localhost,capacitor://localhost}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
