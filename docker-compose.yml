services:
  mysql:
    image: mysql:8.4
    # Emoji (category icons) need 4-byte UTF-8
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: assistant
      MYSQL_USER: ${DB_USER:-assistant}
      MYSQL_PASSWORD: ${DB_PASSWORD:-assistant}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/assistant
      DB_USER: ${DB_USER:-assistant}
      DB_PASSWORD: ${DB_PASSWORD:-assistant}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
